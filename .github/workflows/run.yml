name: Korea Sector Rotation Alert

on:
  workflow_dispatch:          # GitHub Actions 탭에서 수동 실행 버튼 허용[cite: 2]
  repository_dispatch:        # cron-job.org 외부 웹훅 신호를 수신하는 설정[cite: 2]
    types: [wake_up]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # 결과 및 기록 파일 자동 저장을 위한 권한[cite: 2]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4[cite: 2]

      - name: Set up Python
        uses: actions/setup-python@v5[cite: 2]
        with:
          python-version: "3.11"[cite: 2]
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt[cite: 2]

      - name: Run sector rotation script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python main.py KR US

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}[cite: 2]
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add docs/data state || true
          git diff --cached --quiet || git commit -m "sector rotation update $(date -u +%F)"
          git pull --rebase || true
          git push || true
