name: 테마 섹터 예상
on:
  workflow_dispatch:
  repository_dispatch:
    types: [wake_up]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sector rotation script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python main.py KR US

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add docs/data state || true
          git diff --cached --quiet || git commit -m "sector rotation update $(date -u +%F)"
          git pull --rebase || true
          git push || true
