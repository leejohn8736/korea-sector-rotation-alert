name: 예상 섹터 테마

on:
  schedule:
    # 1. 아침 시간대 (한국 시간 KST 기준)
    - cron: '0 22 * * *'   # 매일 아침 07:00 KST (UTC 전날 22:00)
    - cron: '0 23 * * *'   # 매일 아침 08:00 KST (UTC 전날 23:00)
    - cron: '0 0 * * *'    # 매일 아침 09:00 KST (UTC 당일 00:00)
    
    # 2. 오후 시간대 (한국 시간 KST 기준)
    - cron: '0 4 * * *'    # 매일 오후 13:00 KST (UTC 04:00)
    - cron: '0 6 * * *'    # 매일 오후 15:00 KST (UTC 06:00)
    - cron: '0 8 * * *'    # 매일 오후 17:00 KST (UTC 08:00)

  workflow_dispatch:
    inputs:
      market:
        description: "KR / US / ALL"
        default: "ALL"

permissions:
  contents: write

concurrency:
  group: sector-theme-signal
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          
      - run: pip install -r requirements.txt
      
      - name: Pick market
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            M="${{ github.event.inputs.market }}"
          else
            M="KR US"
          fi
          [ "$M" = "ALL" ] && M="KR US"
          echo "markets=$M" >> "$GITHUB_OUTPUT"
          
      - name: Run signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
        run: python main.py ${{ steps.m.outputs.markets }}
        
      - name: Commit results
        run: |
          git config user.name "sector-bot"
          git config user.email "sector-bot@users.noreply.github.com"
          git add docs/data state
          git diff --cached --quiet || git commit -m "sector theme update $(date -u +%F)"
          git pull --rebase && git push
