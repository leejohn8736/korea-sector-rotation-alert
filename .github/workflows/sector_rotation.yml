name: Korea Sector Rotation Alert

on:
  # 지정된 시간에 자동 실행 (KST 기준 07:03, 08:13, 09:03)
  schedule:
    - cron: '3 22 * * *'  # 한국 시간 매일 오전 07:03 (UTC 전날 22:03)
    - cron: '13 23 * * *' # 한국 시간 매일 오전 08:13 (UTC 전날 23:13)
    - cron: '3 0 * * *'   # 한국 시간 매일 오전 09:03 (UTC 당일 00:03)

  # 수동 실행 지원
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. 현재 디렉토리 파일 구조 확인 (디버깅용)
      - name: Check repository structure
        run: |
          echo "=== Workspace File List ==="
          find . -maxdepth 2 -not -path '*/.*'

      # 4. 의존성 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. 분석 스크립트 실행 (main.py 위치 자동 탐색 후 실행)
      - name: Run Sector Rotation Analysis
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MAIN_PATH=$(find . -name "main.py" | head -n 1)
          if [ -z "$MAIN_PATH" ]; then
            echo "Error: main.py 파일을 찾을 수 없습니다."
            exit 1
          fi
          echo "Found main.py at: $MAIN_PATH"
          python "$MAIN_PATH"
