name: Korea Sector Rotation Alert

on:
  # 지정된 시간에 자동 실행 (KST 기준 07:03, 08:13, 09:03)
  schedule:
    - cron: '3 22 * * *'  # 한국 시간 매일 오전 07:03
    - cron: '13 23 * * *' # 한국 시간 매일 오전 08:13
    - cron: '3 0 * * *'   # 한국 시간 매일 오전 09:03

  # 수동으로도 실행할 수 있도록 설정
  workflow_dispatch:

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 환경 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 패키지 캐싱으로 실행 속도 향상

      # 3. 의존성 패키지 설치
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 분석 스크립트 실행 및 환경 변수 주입
      - name: Run Sector Rotation Analysis
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
